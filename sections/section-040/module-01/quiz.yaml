# Knowledge check for section-040. Contract:
# schemas/question-bank.schema.json. Keep question ids stable once published.
schema_version: 1
kind: question_bank
id: ats034-040-01
course_id: ATS034
exam_code: CKS
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-040
  title: "Implement Pod-to-Pod encryption (Cilium, Istio)"
placement:
  position: after
  reading: sections/section-040/module-01/course-05-summary.md
questions:
  - id: ats034-040-01-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "State the default state of Pod traffic."
    source_readings:
      - sections/section-040/module-01/course-01-pod-traffic-and-encryption-options.md
    prompt: "Two Pods on different nodes exchange HTTP requests on a default cluster with no mesh and no encryption feature. What can a packet capture on the network between the nodes show?"
    options:
      - id: a
        text: "Only encrypted packets, because the CNI plugin encrypts by default"
        explanation: "The CNI plugin moves packets and does not encrypt them by default."
      - id: b
        text: "The HTTP requests and responses in plain text"
        explanation: "Correct. Kubernetes does not encrypt Pod traffic unless you add encryption."
      - id: c
        text: "Only the Service name, because the payload is hidden by kube-proxy"
        explanation: "kube-proxy does not hide the payload."
    correct_option: b
    explanation: "Pod-to-Pod traffic is plain text by default."

  - id: ats034-040-01-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Define mTLS."
    source_readings:
      - sections/section-040/module-01/course-01-pod-traffic-and-encryption-options.md
    prompt: "What does mutual TLS add compared with plain TLS?"
    options:
      - id: a
        text: "Both sides present certificates, so each side authenticates the other"
        explanation: "Correct. Plain TLS authenticates only the server."
      - id: b
        text: "A stronger cipher for the same connection"
        explanation: "The cipher is not what changes."
      - id: c
        text: "Encryption of traffic between nodes without sidecars"
        explanation: "That describes node-level encryption, not mTLS."
    correct_option: a
    explanation: "mTLS authenticates both the client and the server."

  - id: ats034-040-01-q03
    type: single_choice
    difficulty: beginner
    learning_objective: "Compare the approaches."
    source_readings:
      - sections/section-040/module-01/course-01-pod-traffic-and-encryption-options.md
      - sections/section-040/module-01/course-04-cilium-transparent-encryption.md
    prompt: "Which approach gives the receiver the identity of the calling workload?"
    options:
      - id: a
        text: "Cilium WireGuard encryption"
        explanation: "It protects packets between nodes and gives no workload identity."
      - id: b
        text: "Cilium IPsec encryption"
        explanation: "It also protects packets between nodes without identifying the workload."
      - id: c
        text: "Istio mTLS between sidecars"
        explanation: "Correct. The certificate carries the SPIFFE ID of the ServiceAccount."
    correct_option: c
    explanation: "Only the mesh approach gives workload identity."

  - id: ats034-040-01-q04
    type: single_choice
    difficulty: beginner
    learning_objective: "Know the default Istio mode."
    source_readings:
      - sections/section-040/module-01/course-02-istio-mutual-tls-with-peerauthentication.md
    prompt: "No PeerAuthentication exists in a namespace with injection enabled. What does the sidecar of a workload accept?"
    options:
      - id: a
        text: "Only mTLS"
        explanation: "That is STRICT mode, which must be configured."
      - id: b
        text: "Both mTLS and plain text"
        explanation: "Correct. PERMISSIVE is the default."
      - id: c
        text: "Only plain text"
        explanation: "That is DISABLE mode."
    correct_option: b
    explanation: "The default is PERMISSIVE."

  - id: ats034-040-01-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict the effect of STRICT."
    source_readings:
      - sections/section-040/module-01/course-02-istio-mutual-tls-with-peerauthentication.md
    prompt: "A `PeerAuthentication` with `mtls.mode: STRICT` is applied to the namespace `starfleet`. A Pod in a namespace without injection sends a plain HTTP request to a Service in `starfleet`. What happens?"
    options:
      - id: a
        text: "The request succeeds, because the Service is reachable"
        explanation: "Reachability is not enough. The receiving sidecar rejects plain text."
      - id: b
        text: "The sidecar of the target closes the connection, and the client sees a connection error"
        explanation: "Correct. STRICT accepts only mTLS."
      - id: c
        text: "The client sidecar upgrades the connection"
        explanation: "The client has no sidecar, so nothing upgrades the connection."
    correct_option: b
    explanation: "STRICT rejects plain-text connections at the receiver."

  - id: ats034-040-01-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Resolve policy scope."
    source_readings:
      - sections/section-040/module-01/course-02-istio-mutual-tls-with-peerauthentication.md
    prompt: "The mesh policy in `istio-system` is `STRICT`. A policy for the Pods with label `app: legacy` in `starfleet` is `PERMISSIVE`. Which mode applies to the `legacy` Pods?"
    options:
      - id: a
        text: "STRICT, because the mesh policy always wins"
        explanation: "The most specific policy wins."
      - id: b
        text: "PERMISSIVE, because the workload policy is more specific"
        explanation: "Correct. Workload, then namespace, then mesh."
      - id: c
        text: "DISABLE, because the two policies conflict"
        explanation: "Conflicting scopes are resolved by specificity, not disabled."
    correct_option: b
    explanation: "The most specific scope wins."

  - id: ats034-040-01-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Plan a rollout."
    source_readings:
      - sections/section-040/module-01/course-02-istio-mutual-tls-with-peerauthentication.md
    prompt: "A team wants STRICT for a namespace that still has a Job without a sidecar. What is the safe order?"
    options:
      - id: a
        text: "Apply STRICT first and fix failures afterward"
        explanation: "The Job fails as soon as the policy takes effect."
      - id: b
        text: "Inject a sidecar into the Job, or give its port an exception, then apply STRICT"
        explanation: "Correct. Every client must be able to use mTLS before enforcement."
      - id: c
        text: "Disable the control plane during the rollout"
        explanation: "This removes certificate issuance and breaks mTLS."
    correct_option: b
    explanation: "Prepare clients before enforcing."

  - id: ats034-040-01-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Understand the authorization default."
    source_readings:
      - sections/section-040/module-01/course-03-authorizing-workloads-with-authorizationpolicy.md
    prompt: "A workload has no AuthorizationPolicy. A first `ALLOW` policy with one rule is applied to it. What happens to a request that matches no rule?"
    options:
      - id: a
        text: "It is allowed, because ALLOW policies only add permissions"
        explanation: "The first ALLOW policy changes the default to deny."
      - id: b
        text: "It is rejected"
        explanation: "Correct. With an ALLOW policy present, requests that match no rule are rejected."
      - id: c
        text: "It is sent to the control plane for a decision"
        explanation: "The sidecar decides locally."
    correct_option: b
    explanation: "An ALLOW policy turns the workload to default deny."

  - id: ats034-040-01-q09
    type: single_choice
    difficulty: advanced
    learning_objective: "Diagnose a principal rule."
    source_readings:
      - sections/section-040/module-01/course-03-authorizing-workloads-with-authorizationpolicy.md
    prompt: "A policy allows only the principal `cluster.local/ns/starfleet/sa/bridge`. The namespace is in PERMISSIVE mode, and a client without a sidecar calls the workload in plain text. What is the result?"
    options:
      - id: a
        text: "The call is allowed, because plain-text callers are trusted"
        explanation: "A plain-text caller has no principal."
      - id: b
        text: "The call is denied, because it has no principal that matches the rule"
        explanation: "Correct. Principal rules match only mTLS callers."
      - id: c
        text: "The call is allowed once, then cached"
        explanation: "There is no such caching."
    correct_option: b
    explanation: "No mTLS means no principal, so the rule cannot match."

  - id: ats034-040-01-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Choose a combination."
    source_readings:
      - sections/section-040/module-01/course-01-pod-traffic-and-encryption-options.md
      - sections/section-040/module-01/course-04-cilium-transparent-encryption.md
    prompt: "A cluster must encrypt all traffic between nodes, including Pods without sidecars, and must restrict callers by workload identity in one namespace. Which design fits?"
    options:
      - id: a
        text: "Cilium encryption for the nodes, and Istio STRICT mTLS with AuthorizationPolicy in the namespace"
        explanation: "Correct. Each tool covers one requirement."
      - id: b
        text: "Cilium encryption alone, because it identifies workloads"
        explanation: "It does not provide workload identity."
      - id: c
        text: "Istio PERMISSIVE mode alone, because it encrypts every connection"
        explanation: "PERMISSIVE accepts plain text, so it does not guarantee encryption."
    correct_option: a
    explanation: "Use node encryption for coverage and the mesh for identity."
