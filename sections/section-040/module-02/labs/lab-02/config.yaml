apiVersion: astrona.io/v1
metadata:
  name: ats-034-lab-040-02-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    - registry.istio.io/release/pilot:1.30.5
    - registry.istio.io/release/proxyv2:1.30.5
    nodes:
      workers: 1
bootstrap:
  init:
  - name: install-istio-and-workloads
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
- name: namespace-strict
  description: The PeerAuthentication namespace-strict in starfleet-034-040-02-02 has no selector and sets STRICT, and the drifter pod is reset by the probe sidecar
  type: file
  source: validation/validate-namespace-strict.sh
  points: 1
- name: legacy-exception
  description: The PeerAuthentication legacy-permissive selects only the legacy pods and accepts plain text on port 8080, and the drifter pod gets a reply from legacy
  type: file
  source: validation/validate-legacy-exception.sh
  points: 1
- name: meshed-client-works
  description: The shuttle pod with its sidecar still gets replies from both the probe and the legacy Service
  type: file
  source: validation/validate-meshed-client-works.sh
  points: 1
