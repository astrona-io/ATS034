apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: istio-system
spec:
  mtls:
    mode: STRICT
---
apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-034-040-02-01
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: depot-034-040-02-01
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost-034-040-02-01
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: server-code
  namespace: starfleet-034-040-02-01
data:
  server.py: "from http.server import BaseHTTPRequestHandler, HTTPServer\nimport os\nimport socket\n\nclass Handler(BaseHTTPRequestHandler):\n    def do_GET(self):\n        body = f\"version={os.getenv('VERSION', 'v1')} host={socket.gethostname()}\\n\"\n        self.send_response(200)\n        self.send_header(\"Content-Type\", \"text/plain\")\n        self.end_headers()\n        self.wfile.write(body.encode())\n\nHTTPServer((\"0.0.0.0\", 8080), Handler).serve_forever()\n"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: probe
  namespace: starfleet-034-040-02-01
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet-034-040-02-01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      serviceAccountName: probe
      containers:
      - name: server
        image: docker.io/library/python:3.13-alpine
        command:
        - python
        - /app/server.py
        env:
        - name: VERSION
          value: v1
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 2
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: app
          mountPath: /app
          readOnly: true
      volumes:
      - name: app
        configMap:
          name: server-code
---
apiVersion: v1
kind: Service
metadata:
  name: probe
  namespace: starfleet-034-040-02-01
spec:
  selector:
    app: probe
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shuttle
  namespace: starfleet-034-040-02-01
---
apiVersion: v1
kind: Pod
metadata:
  name: shuttle
  namespace: starfleet-034-040-02-01
  labels:
    app: shuttle
spec:
  serviceAccountName: shuttle
  containers:
  - name: client
    image: docker.io/library/busybox:1.37.0
    command:
    - sleep
    - "86400"
---
