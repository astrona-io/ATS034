apiVersion: astrona.io/v1
metadata:
  name: ats-034-lab-040-03-03
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    networking:
      disableDefaultCNI: true
    preloadImages:
    - quay.io/cilium/cilium:v1.20.4
    - quay.io/cilium/operator-generic:v1.20.4
    - quay.io/cilium/cilium-envoy:v1.39.5-1792733054-8c73b2816bc8239e27f1fd53b271884688137459
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: install-cilium-and-workloads
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: stale-node-recorded
    description: "The ConfigMap encryption-diagnosis in starfleet-034-040-03-03 has the key node set to the name of the node whose Cilium agent still reported Encryption: Disabled"
    type: file
    source: validation/validate-stale-node-recorded.sh
    points: 1
  - name: wireguard-on-every-agent
    description: "Every Cilium agent reports Encryption: Wireguard and has the cilium_wg0 interface on its node"
    type: file
    source: validation/validate-wireguard-on-every-agent.sh
    points: 1
  - name: wireguard-peers
    description: "Every Cilium agent has one WireGuard peer for each other node, and the shuttle pod gets probe-reply from the probe Service on the other node"
    type: file
    source: validation/validate-wireguard-peers.sh
    points: 1
