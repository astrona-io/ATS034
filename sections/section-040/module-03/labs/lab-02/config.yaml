apiVersion: astrona.io/v1
metadata:
  name: ats-034-lab-040-03-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    networking:
      disableDefaultCNI: true
    preloadImages:
    - quay.io/cilium/cilium:v1.20.4
    - quay.io/cilium/operator-generic:v1.20.4
    - quay.io/cilium/cilium-envoy:v1.39.5-1792733054-8c73b2816bc8239e27f1fd53b271884688137459
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: install-cilium-and-workloads
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: key-rotated
    description: "The Secret cilium-ipsec-keys holds a new key in the format SPI, rfc4106(gcm(aes)), 40 hexadecimal characters, 128, with an SPI above the starting SPI 3"
    type: file
    source: validation/validate-key-rotated.sh
    points: 1
  - name: agents-use-new-key
    description: "Every Cilium agent reports IPsec with no errors and its node has security associations with the new SPI, and the shuttle pod still gets probe-reply from the probe Service on the other node"
    type: file
    source: validation/validate-agents-use-new-key.sh
    points: 1
