apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-034-040-03-02
---
apiVersion: v1
kind: Pod
metadata:
  name: probe
  namespace: starfleet-034-040-03-02
  labels:
    app: probe
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: DoesNotExist
  containers:
  - name: server
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - mkdir -p /www && echo probe-reply > /www/index.html && exec httpd -f -p 8080 -h /www
    ports:
    - name: http
      containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: probe
  namespace: starfleet-034-040-03-02
spec:
  selector:
    app: probe
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: shuttle
  namespace: starfleet-034-040-03-02
  labels:
    app: shuttle
spec:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  containers:
  - name: client
    image: docker.io/library/busybox:1.37.0
    command:
    - sleep
    - "86400"
