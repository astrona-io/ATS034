apiVersion: v1
kind: ConfigMap
metadata:
  name: cilium-values
  namespace: kube-system
data:
  values.json: |
    {
      "encryption": {
        "enabled": true,
        "type": "ipsec",
        "ipsec": {
          "secretName": "cilium-ipsec-keys",
          "keyFile": "keys",
          "mountPath": "/etc/ipsec"
        }
      }
    }
