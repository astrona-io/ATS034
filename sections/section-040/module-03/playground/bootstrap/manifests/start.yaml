apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: Pod
metadata:
  name: probe
  namespace: starfleet
  labels:
    app: probe
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: DoesNotExist
  containers:
  - name: server
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - mkdir -p /www && echo probe-reply > /www/index.html && exec httpd -f -p 8080 -h /www
    ports:
    - name: http
      containerPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: shuttle
  namespace: starfleet
  labels:
    app: shuttle
spec:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  containers:
  - name: client
    image: docker.io/library/busybox:1.37.0
    command:
    - sleep
    - "86400"
---
apiVersion: v1
kind: Namespace
metadata:
  name: node-tools
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-tools
  namespace: node-tools
spec:
  selector:
    matchLabels:
      app: node-tools
  template:
    metadata:
      labels:
        app: node-tools
    spec:
      hostNetwork: true
      tolerations:
      - operator: Exists
      containers:
      - name: tools
        image: docker.io/nicolaka/netshoot:v0.14
        command:
        - sleep
        - infinity
        securityContext:
          privileged: true
