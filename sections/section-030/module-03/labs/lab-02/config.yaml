apiVersion: astrona.io/v1
metadata:
  name: ats-034-lab-030-03-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: protected-label
    description: The worker node has the label node-restriction.kubernetes.io/tenant=tenant-d and no plain tenant label, and the kubelet credentials of the worker get Forbidden when they try to change the protected label
    type: file
    source: validation/validate-protected-label.sh
    points: 2
  - name: tenant-workload
    description: Deployment tenant-d-app selects node-restriction.kubernetes.io/tenant=tenant-d only, and its Pod runs Ready on the worker node
    type: file
    source: validation/validate-tenant-workload.sh
    points: 1
