apiVersion: astrona.io/v1
metadata:
  name: ats-034-playground-030-02
  docs:
    guide: docs/overview.md
# A real kubeadm node with gVisor installed and the runsc handler registered
# in containerd, so the guide and the module parts run real sandboxed Pods
# instead of a kind node container that has only runc.
runtime:
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks-arm64
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 25
    display: false
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
