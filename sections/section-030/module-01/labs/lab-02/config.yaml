apiVersion: astrona.io/v1
metadata:
  name: ats-034-lab-030-01-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/busybox:1.37.0
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: compute-budget
    description: The ResourceQuota compute-budget allows 2 Pods, 128Mi of memory requests and 256Mi of memory limits, and the API server rejects a Pod that goes over it
    type: file
    source: validation/validate-compute-budget.sh
    points: 1
  - name: container-defaults
    description: The LimitRange container-defaults gives each container a 32Mi memory request and a 64Mi memory limit, and the burst Pods received these values
    type: file
    source: validation/validate-container-defaults.sh
    points: 1
  - name: third-replica-blocked
    description: The burst Deployment asks for 3 replicas, 2 Pods run, and the quota rejects the third Pod with exceeded quota
    type: file
    source: validation/validate-third-replica-blocked.sh
    points: 1
