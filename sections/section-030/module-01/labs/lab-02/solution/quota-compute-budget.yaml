apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-budget
  namespace: tenant-a-034-030-01-02
spec:
  hard:
    pods: "2"
    requests.memory: 128Mi
    limits.memory: 256Mi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: tenant-a-034-030-01-02
spec:
  limits:
  - type: Container
    defaultRequest:
      memory: 32Mi
    default:
      memory: 64Mi
