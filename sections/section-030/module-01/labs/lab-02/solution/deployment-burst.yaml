apiVersion: apps/v1
kind: Deployment
metadata:
  name: burst
  namespace: tenant-a-034-030-01-02
spec:
  replicas: 3
  selector:
    matchLabels:
      app: burst
  template:
    metadata:
      labels:
        app: burst
    spec:
      containers:
      - name: burst
        image: docker.io/library/busybox:1.37.0
        command: ["sleep", "3600"]
