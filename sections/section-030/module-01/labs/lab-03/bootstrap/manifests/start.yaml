apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-034-030-01-03
---
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-a-034-030-01-03
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: server-code
  namespace: starfleet-034-030-01-03
data:
  server.py: |
    from http.server import BaseHTTPRequestHandler, HTTPServer
    import os
    import socket

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            body = f"version=v1 app={os.getenv('APP')} host={socket.gethostname()}\n"
            self.send_response(200)
            self.send_header("Content-Type", "text/plain")
            self.end_headers()
            self.wfile.write(body.encode())

    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet-034-030-01-03
spec:
  replicas: 2
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      containers:
      - name: probe
        image: docker.io/library/python:3.13-alpine
        command: ["python", "/app/server.py"]
        env:
        - name: APP
          value: probe
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 2
        volumeMounts:
        - name: app
          mountPath: /app
          readOnly: true
      volumes:
      - name: app
        configMap:
          name: server-code
---
apiVersion: v1
kind: Service
metadata:
  name: probe
  namespace: starfleet-034-030-01-03
spec:
  selector:
    app: probe
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: beacon
  namespace: starfleet-034-030-01-03
  labels:
    app: beacon
spec:
  containers:
  - name: beacon
    image: docker.io/library/python:3.13-alpine
    command: ["python", "/app/server.py"]
    env:
    - name: APP
      value: beacon
    ports:
    - name: http
      containerPort: 8080
    readinessProbe:
      tcpSocket:
        port: http
      periodSeconds: 2
    volumeMounts:
    - name: app
      mountPath: /app
      readOnly: true
  volumes:
  - name: app
    configMap:
      name: server-code
---
apiVersion: v1
kind: Pod
metadata:
  name: shuttle
  namespace: starfleet-034-030-01-03
  labels:
    app: shuttle
spec:
  containers:
  - name: client
    image: docker.io/library/busybox:1.37.0
    command: ["sleep", "infinity"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: tenant-a-034-030-01-03
---
apiVersion: v1
kind: Pod
metadata:
  name: worker
  namespace: tenant-a-034-030-01-03
  labels:
    app: worker
spec:
  serviceAccountName: worker
  containers:
  - name: worker
    image: docker.io/library/busybox:1.37.0
    command: ["sleep", "infinity"]
