apiVersion: astrona.io/v1
metadata:
  name: ats-034-lab-030-01-03
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    addons:
      cni: calico
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: default-deny
    description: The NetworkPolicy default-deny selects every Pod in tenant-a-034-030-01-03 for ingress and egress with no rules, and the worker Pod times out to the beacon Pod while shuttle still reaches it
    type: file
    source: validation/validate-default-deny.sh
    points: 1
  - name: probe-allowed
    description: The NetworkPolicy allow-probe lets the worker Pod reach the probe Service, and the worker Pod still times out to the beacon Pod
    type: file
    source: validation/validate-probe-allowed.sh
    points: 1
  - name: no-token
    description: The ServiceAccount worker turns off the token mount and the running worker Pod has no token directory
    type: file
    source: validation/validate-no-token.sh
    points: 1
