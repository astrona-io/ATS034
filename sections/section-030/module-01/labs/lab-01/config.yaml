apiVersion: astrona.io/v1
metadata:
  name: ats-034-lab-030-01-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
    addons:
      cni: calico
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: namespace-restricted
    description: Namespace tenant-a-034-030-01-01 enforces Restricted at v1.35
    type: file
    source: validation/validate-namespace-restricted.sh
    points: 1
  - name: resource-quota
    description: ResourceQuota tenant-budget caps the namespace at three Pods
    type: file
    source: validation/validate-resource-quota.sh
    points: 1
  - name: default-deny-policy
    description: NetworkPolicy tenant-isolation denies all ingress and egress and the tenant Pod cannot reach probe
    type: file
    source: validation/validate-default-deny-policy.sh
    points: 1
  - name: tenant-reader
    description: Pod tenant-reader runs Ready under the restricted profile
    type: file
    source: validation/validate-tenant-reader.sh
    points: 2
