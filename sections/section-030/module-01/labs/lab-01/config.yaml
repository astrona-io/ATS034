apiVersion: astrona.io/v1
metadata:
  name: ats-034-lab-030-01-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: tenant-a-access
    description: The RoleBinding tenant-editor binds the user alice to the Role tenant-editor, and alice can create Deployments, Pods, Services and ConfigMaps in tenant-a-034-030-01-01
    type: file
    source: validation/validate-tenant-a-access.sh
    points: 1
  - name: no-secrets
    description: The user alice gets Forbidden when she reads or creates Secrets in tenant-a-034-030-01-01
    type: file
    source: validation/validate-no-secrets.sh
    points: 1
  - name: other-namespaces-denied
    description: The user alice gets Forbidden in tenant-b-034-030-01-01 and on cluster-scoped objects, and no ClusterRoleBinding names her
    type: file
    source: validation/validate-other-namespaces-denied.sh
    points: 1
