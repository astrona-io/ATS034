apiVersion: astrona.io/v1
metadata:
  name: ats-034-lab-020-02-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: pull-secret
    description: Secret registry-pull is a dockerconfigjson Secret for registry.example.test
    type: file
    source: validation/validate-pull-secret.sh
    points: 1
  - name: serviceaccount-pull
    description: ServiceAccount puller lists registry-pull in imagePullSecrets
    type: file
    source: validation/validate-serviceaccount-pull.sh
    points: 1
  - name: pod-receives-pull-secret
    description: Pod pull-check runs as ServiceAccount puller and receives registry-pull in its imagePullSecrets
    type: file
    source: validation/validate-pod-receives-pull-secret.sh
    points: 2
