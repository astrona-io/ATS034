apiVersion: v1
kind: Secret
metadata:
  name: probe-login
  namespace: starfleet
type: kubernetes.io/basic-auth
immutable: true
stringData:
  username: scout
  password: disposable-login
---
apiVersion: v1
kind: Pod
metadata:
  name: login-reader
  namespace: starfleet
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
  - name: reader
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 3600
    volumeMounts:
    - name: login
      mountPath: /login
      readOnly: true
  volumes:
  - name: login
    secret:
      secretName: probe-login
      defaultMode: 0400
