apiVersion: v1
kind: Pod
metadata:
  name: credential-reader
  namespace: starfleet
spec:
  restartPolicy: Never
  serviceAccountName: reader
  automountServiceAccountToken: false
  containers:
  - name: reader
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 3600
    volumeMounts:
    - name: credentials
      mountPath: /credentials
      readOnly: true
  volumes:
  - name: credentials
    secret:
      secretName: probe-credentials
      defaultMode: 0400
