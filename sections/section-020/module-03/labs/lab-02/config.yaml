apiVersion: astrona.io/v1
metadata:
  name: ats-034-lab-020-03-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  # The task changes the kube-apiserver static pod and reads etcd on the
  # node, so the lab runs a real one-node kubeadm cluster in a VM.
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 25
    display: false
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: vm/install.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: vm/verify-start.sh
  - name: reference-result
    type: file
    source: vm/apply-solution.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: vm/wait-solved.sh
validation:
  scripts:
  - name: audit-enabled
    description: kube-apiserver writes an audit log that records a Secret get at Metadata level without request or response bodies
    type: file
    source: vm/validate-audit-enabled.sh
    points: 2
  - name: auditor-read-logged
    description: The audit log holds the get of Secret probe-credentials by ServiceAccount auditor, at Metadata level
    type: file
    source: vm/validate-auditor-read-logged.sh
    points: 2
