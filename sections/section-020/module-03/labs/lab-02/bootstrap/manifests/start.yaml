apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-034-020-03-02
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auditor
  namespace: starfleet-034-020-03-02
---
apiVersion: v1
kind: Secret
metadata:
  name: probe-credentials
  namespace: starfleet-034-020-03-02
type: Opaque
stringData:
  password: disposable-probe-password
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
  namespace: starfleet-034-020-03-02
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  resourceNames:
  - probe-credentials
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auditor-secret-reader
  namespace: starfleet-034-020-03-02
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-reader
subjects:
- kind: ServiceAccount
  name: auditor
  namespace: starfleet-034-020-03-02
