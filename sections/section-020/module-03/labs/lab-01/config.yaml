apiVersion: astrona.io/v1
metadata:
  name: ats-034-lab-020-03-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: credential-secret
    description: Secret migrated-credentials holds the credential
    type: file
    source: validation/validate-credential-secret.sh
    points: 1
  - name: secret-volume-reader
    description: Pod migrated-reader reads the credential from a Secret volume and has no credential in its environment
    type: file
    source: validation/validate-secret-volume-reader.sh
    points: 2
  - name: configmap-removed
    description: ConfigMap legacy-settings is deleted
    type: file
    source: validation/validate-configmap-removed.sh
    points: 1
