apiVersion: astrona.io/v1
metadata:
  name: ats-034-lab-020-01-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: environment-delivery
    description: Pod token-reader reads PRACTICE_TOKEN from the key token of Secret practice-token
    type: file
    source: validation/validate-environment-delivery.sh
    points: 2
  - name: volume-delivery
    description: Pod token-reader reads /credentials/token from Secret practice-token with file mode 0400
    type: file
    source: validation/validate-volume-delivery.sh
    points: 2
