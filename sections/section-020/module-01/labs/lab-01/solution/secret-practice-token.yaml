apiVersion: v1
kind: Secret
metadata:
  name: practice-token
  namespace: starfleet-034-020-01-01
type: Opaque
stringData:
  token: disposable-v2
---
apiVersion: v1
kind: Pod
metadata:
  name: rotated-reader
  namespace: starfleet-034-020-01-01
spec:
  restartPolicy: Never
  containers:
  - name: reader
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 3600
    env:
    - name: PRACTICE_TOKEN
      valueFrom:
        secretKeyRef:
          name: practice-token
          key: token
    volumeMounts:
    - name: secret
      mountPath: /credentials
      readOnly: true
  volumes:
  - name: secret
    secret:
      secretName: practice-token
