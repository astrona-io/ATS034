apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-034-020-01-01
---
apiVersion: v1
kind: Secret
metadata:
  name: practice-token
  namespace: starfleet-034-020-01-01
type: Opaque
stringData:
  token: disposable-v1
---
apiVersion: v1
kind: Pod
metadata:
  name: shuttle
  namespace: starfleet-034-020-01-01
  labels:
    app: shuttle
spec:
  containers:
  - name: client
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 86400
  restartPolicy: Never
