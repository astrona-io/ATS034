apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-034-020-01-02
---
apiVersion: v1
kind: Secret
metadata:
  name: practice-token
  namespace: starfleet-034-020-01-02
type: Opaque
stringData:
  token: disposable-v1
---
apiVersion: v1
kind: Pod
metadata:
  name: file-reader
  namespace: starfleet-034-020-01-02
  labels:
    app: file-reader
spec:
  restartPolicy: Never
  containers:
  - name: reader
    image: docker.io/library/busybox:1.37.0
    command: ["sleep", "86400"]
    volumeMounts:
    - name: credentials
      mountPath: /credentials
      readOnly: true
  volumes:
  - name: credentials
    secret:
      secretName: practice-token
---
apiVersion: v1
kind: Pod
metadata:
  name: env-reader
  namespace: starfleet-034-020-01-02
  labels:
    app: env-reader
spec:
  restartPolicy: Never
  containers:
  - name: reader
    image: docker.io/library/busybox:1.37.0
    command: ["sleep", "86400"]
    env:
    - name: PRACTICE_TOKEN
      valueFrom:
        secretKeyRef:
          name: practice-token
          key: token
