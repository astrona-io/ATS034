apiVersion: v1
kind: Pod
metadata:
  name: env-reader
  namespace: starfleet-034-020-01-02
  labels:
    app: env-reader
spec:
  restartPolicy: Never
  containers:
  - name: reader
    image: docker.io/library/busybox:1.37.0
    command: ["sleep", "86400"]
    env:
    - name: PRACTICE_TOKEN
      valueFrom:
        secretKeyRef:
          name: practice-token
          key: token
