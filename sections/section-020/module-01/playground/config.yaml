apiVersion: astrona.io/v1
metadata:
  name: ats-034-playground-020-01
  docs:
    guide: docs/overview.md
# A real kubeadm node, so the encryption at rest steps change the real
# kube-apiserver static pod manifest and read the real etcd data.
runtime:
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 25
    display: false
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
