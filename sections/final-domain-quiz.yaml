questions:
- id: ats034-final-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Name the profile that places no restrictions on a Pod.
  source_readings:
  - sections/section-010/module-01/course-01-the-three-pod-security-standards.md
  prompt: Which Pod Security Standards profile places no restrictions on the settings of a Pod?
  options:
  - id: a
    text: Privileged
    explanation: Correct. Privileged allows any setting. It is meant for trusted system components.
  - id: b
    text: Baseline
    explanation: Baseline blocks known privilege escalations, such as privileged containers and host namespaces.
  - id: c
    text: Restricted
    explanation: Restricted is the strictest profile and adds hardening rules on top of Baseline.
  correct_option: a
  explanation: Privileged has no restrictions, Baseline blocks known node-access settings, and Restricted adds hardening rules.
- id: ats034-final-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Predict the result of runAsNonRoot with an image that runs as root.
  source_readings:
  - sections/section-010/module-02/course-01-run-as-a-non-root-user.md
  prompt: 'A container sets `runAsNonRoot: true` but no `runAsUser`, and its image runs as user 0. What happens?'
  options:
  - id: a
    text: The kubelet refuses to start the container and the Pod shows `CreateContainerConfigError`.
    explanation: Correct. The kubelet checks the effective user before it starts the container.
  - id: b
    text: The API server rejects the Pod when it is created.
    explanation: The API server cannot read the user of the image, so it admits the Pod. The kubelet makes the check.
  - id: c
    text: The container starts and runs as a random non-root user.
    explanation: Kubernetes does not choose another user. It only refuses to run as root.
  correct_option: a
  explanation: The kubelet knows the image user at start time, so it blocks the container and reports a configuration error.
- id: ats034-final-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Order the modes in a staged label change.
  source_readings:
  - sections/section-010/module-03/course-02-stage-a-label-change.md
  prompt: Which order is safest when a namespace with running workloads moves to a stricter profile?
  options:
  - id: a
    text: Set enforce first, then warn and audit.
    explanation: Enforcement first causes failed Pods with no earlier warning.
  - id: b
    text: Set warn and audit first, fix the workloads, then set enforce with a pinned version.
    explanation: Correct. Warnings tell people what to fix before anything is blocked.
  - id: c
    text: Set only audit and never set enforce.
    explanation: Audit alone never blocks a Pod.
  correct_option: b
  explanation: The modes warn and audit report problems without blocking, so they come before enforce.
- id: ats034-final-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain how a rotated Secret reaches a running Pod.
  source_readings:
  - sections/section-020/module-01/course-03-rotating-a-secret.md
  prompt: A Secret is updated in place. One Pod reads it through an environment variable and another through a mounted file. What does each Pod see after the update?
  options:
  - id: a
    text: The environment variable keeps the old value until the Pod restarts. The mounted file receives the new value after the kubelet syncs.
    explanation: Correct. The kubelet refreshes mounted Secret files, but a process environment is fixed when the container starts.
  - id: b
    text: Both receive the new value at once.
    explanation: An environment variable is set once at container start and never changes.
  - id: c
    text: Neither changes until the Secret is deleted and created again.
    explanation: A mounted file is refreshed by the kubelet without a recreate.
  correct_option: a
  explanation: Environment variables need a restart. Mounted files update after the kubelet syncs, unless the volume uses `subPath`.
- id: ats034-final-q05
  type: single_choice
  difficulty: advanced
  learning_objective: Plan the rotation of an immutable Secret used by a Deployment.
  source_readings:
  - sections/section-020/module-02/course-03-immutable-secrets.md
  prompt: A Deployment mounts the immutable Secret `db-v1`. You must change the password. Which procedure rolls out the new value?
  options:
  - id: a
    text: Patch the data of `db-v1` and wait for the kubelet to sync.
    explanation: The API server rejects changes to the data of an immutable Secret.
  - id: b
    text: Delete `db-v1`, create `db-v1` again and wait.
    explanation: The Pod template does not change, so no rollout starts.
  - id: c
    text: Create `db-v2`, change the Pod template to use it and let the rolling update restart the Pods.
    explanation: Correct. A changed template makes the Deployment start new Pods with the new Secret.
  correct_option: c
  explanation: Use a new Secret name and change the Pod template so a rolling update loads the new value.
- id: ats034-final-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Choose the audit level for Secrets.
  source_readings:
  - sections/section-020/module-03/course-04-auditing-secret-access.md
  prompt: Which audit level should the API server policy give requests for Secrets?
  options:
  - id: a
    text: "`RequestResponse`"
    explanation: It writes the response body, which holds the Secret value.
  - id: b
    text: "`Request`"
    explanation: It writes the request body, which holds the value on create and update.
  - id: c
    text: "`Metadata`"
    explanation: Correct. It records who, what and the result, without values.
  correct_option: c
  explanation: Use `Metadata` for Secrets and ConfigMaps so the audit log holds no credentials.
- id: ats034-final-q07
  type: single_choice
  difficulty: beginner
  learning_objective: State what a namespace does not isolate.
  source_readings:
  - sections/section-030/module-01/course-01-namespaces-and-rbac-as-a-tenant-boundary.md
  prompt: Two teams get one namespace each in a shared cluster. Which statement is true by default?
  options:
  - id: a
    text: Each namespace has its own nodes and PersistentVolumes.
    explanation: Nodes and PersistentVolumes are cluster-scoped and have no namespace.
  - id: b
    text: Pods in one namespace cannot open connections to Pods in the other.
    explanation: Without a NetworkPolicy, every Pod can reach every other Pod in any namespace.
  - id: c
    text: Pods of both namespaces on the same node share the same Linux kernel.
    explanation: Correct. A namespace separates names and policy. It does not give a separate kernel.
  correct_option: c
  explanation: Namespaces scope names and policy. Nodes, the kernel and, by default, the network are shared.
- id: ats034-final-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Predict the fields a RuntimeClass adds to a Pod.
  source_readings:
  - sections/section-030/module-02/course-03-runtimeclass-scheduling-and-overhead.md
  prompt: A RuntimeClass sets `overhead.podFixed` and `scheduling.nodeSelector`. A Pod selects the class and sets neither field. What does the API server store in the Pod?
  options:
  - id: a
    text: The Pod unchanged, because the scheduler reads the class.
    explanation: The RuntimeClass admission plugin writes the fields into the Pod at creation.
  - id: b
    text: The overhead and the merged node selector.
    explanation: Correct. The plugin copies the overhead and merges the selector, so the scheduler and quota use them.
  - id: c
    text: Only a toleration for the class.
    explanation: The class adds only the tolerations that it lists, together with the other fields.
  correct_option: b
  explanation: Admission copies the overhead and merges the scheduling fields into the Pod.
- id: ats034-final-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: Combine a taint, a toleration and a node selector.
  source_readings:
  - sections/section-030/module-03/course-01-dedicated-nodes-with-taints-and-tolerations.md
  prompt: A node carries the taint `tenant=a:NoSchedule`. The tenant Pods have a matching toleration and no node selector. What is true?
  options:
  - id: a
    text: The Pods can run on any node they tolerate, including shared nodes.
    explanation: Correct. A toleration permits and does not attract. Without a selector the scheduler may choose another node.
  - id: b
    text: The Pods run only on the tainted node.
    explanation: Only a node selector or affinity attracts Pods to a node.
  - id: c
    text: The taint evicts the Pods.
    explanation: NoSchedule never evicts running Pods.
  correct_option: a
  explanation: Dedicating a node needs the taint, the label, the selector and the toleration together.
- id: ats034-final-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: Choose the narrowest exception in a strict namespace.
  source_readings:
  - sections/section-040/module-02/course-02-migrating-from-permissive-to-strict.md
  prompt: The namespace `starfleet` has a `STRICT` `PeerAuthentication`. A client without a sidecar must keep reaching only the `legacy` workload. What is the narrowest change?
  options:
  - id: a
    text: Change the namespace policy to `PERMISSIVE`.
    explanation: That opens every workload in the namespace to plain text.
  - id: b
    text: Add a workload policy with `PERMISSIVE` that selects the `legacy` Pods.
    explanation: Correct. The narrower workload policy replaces the namespace policy for those Pods only.
  - id: c
    text: Delete the `PeerAuthentication` of the namespace.
    explanation: That removes the strict requirement for every workload.
  correct_option: b
  explanation: A selector-based workload policy limits the exception to the legacy Pods.
- id: ats034-final-q11
  type: single_choice
  difficulty: intermediate
  learning_objective: Name what proves that mTLS is enforced.
  source_readings:
  - sections/section-040/module-02/course-04-verifying-and-troubleshooting-mtls.md
  prompt: A namespace policy says `STRICT`. Which evidence best shows that mTLS is enforced?
  options:
  - id: a
    text: The `PeerAuthentication` object exists.
    explanation: A declaration is not proof of enforcement.
  - id: b
    text: A client with a sidecar reaches the service and a client without a sidecar gets a connection reset.
    explanation: Correct. One allowed and one denied request show the behaviour, and proxy handshake counters add evidence.
  - id: c
    text: The Pods of the service are `Ready`.
    explanation: Readiness does not show the transport.
  correct_option: b
  explanation: Test an allowed and a denied path, and read the proxy for handshake evidence.
- id: ats034-final-q12
  type: single_choice
  difficulty: advanced
  learning_objective: Combine Cilium encryption with mesh identity.
  source_readings:
  - sections/section-040/module-03/course-01-what-cilium-encrypts.md
  - sections/section-040/module-03/course-04-verifying-and-limits.md
  prompt: A cluster has Cilium WireGuard encryption enabled. An `AuthorizationPolicy` must allow only one ServiceAccount to call a service. Which statement is correct?
  options:
  - id: a
    text: WireGuard identifies the sending Pod, so no other control is needed.
    explanation: WireGuard keys belong to nodes, not Pods.
  - id: b
    text: The `AuthorizationPolicy` needs mTLS between sidecars, because Cilium encryption does not give a principal.
    explanation: Correct. The principal comes from the mTLS certificate. Cilium protects the node-to-node path.
  - id: c
    text: Cilium encryption also encrypts traffic between Pods on the same node.
    explanation: Same-node traffic does not leave the node and is not encrypted by Cilium.
  correct_option: b
  explanation: Cilium covers the path between nodes. Principals come from Istio mTLS.
