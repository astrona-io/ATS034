apiVersion: astrona.io/v1
metadata:
  name: ats-034-playground-010-02
  docs:
    guide: docs/overview.md
# A real kubeadm node with AppArmor, so the seccomp and AppArmor steps place
# Localhost profiles on the node itself. A kind node uses the kernel of the
# machine that runs Podman, which often has no AppArmor.
runtime:
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 25
    display: false
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
