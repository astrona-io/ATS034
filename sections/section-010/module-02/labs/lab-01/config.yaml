apiVersion: astrona.io/v1
metadata:
  name: ats-034-lab-010-02-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: pod-security-context
    description: The scanner Pod template runs as non-root user 1000 with the RuntimeDefault seccomp profile
    type: file
    source: validation/validate-pod-security-context.sh
    points: 1
  - name: container-security-context
    description: Container scanner blocks privilege escalation, has a read-only root filesystem and drops all capabilities
    type: file
    source: validation/validate-container-security-context.sh
    points: 1
  - name: tmp-volume
    description: An emptyDir volume named tmp is mounted at /tmp in container scanner
    type: file
    source: validation/validate-tmp-volume.sh
    points: 1
  - name: scanner-runs
    description: Deployment scanner is Ready, runs as 1000 with no_new_privs, writes /tmp/result and cannot write to /
    type: file
    source: validation/validate-scanner-runs.sh
    points: 1
