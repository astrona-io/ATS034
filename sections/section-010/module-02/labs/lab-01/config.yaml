apiVersion: astrona.io/v1
metadata:
  name: ats-034-lab-010-02-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: probe-non-root
    description: Both probe Pods run with runAsNonRoot set and their process has user ID 1000
    type: file
    source: validation/validate-probe-non-root.sh
    points: 1
  - name: service-answers
    description: shuttle gets the probe reply through the probe Service, and the Pod that answered runs as user ID 1000
    type: file
    source: validation/validate-service-answers.sh
    points: 1
