apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-034-010-02-04
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.35
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: starfleet-034-010-02-04
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
    spec:
      hostNetwork: true
      containers:
      - name: collector
        image: docker.io/library/busybox:1.37.0
        command: ["sleep", "infinity"]
        volumeMounts:
        - name: logs
          mountPath: /logs
      volumes:
      - name: logs
        hostPath:
          path: /var/log
          type: Directory
