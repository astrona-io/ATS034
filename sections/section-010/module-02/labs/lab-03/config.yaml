apiVersion: astrona.io/v1
metadata:
  name: ats-034-lab-010-02-03
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
# Seccomp and AppArmor profiles live on the node. A kind node uses the kernel
# of the machine that runs Podman, which often has no AppArmor, so the lab runs
# a real one-node kubeadm cluster in a VM with AppArmor enabled.
runtime:
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 25
    display: false
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: vm/install.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: vm/verify-start.sh
  - name: reference-result
    type: file
    source: vm/apply-solution.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: vm/wait-solved.sh
validation:
  scripts:
  - name: mkdir-blocked
    description: scout runs under the Localhost seccomp profile profiles/block-mkdir.json, and mkdir fails with Operation not permitted
    type: file
    source: vm/validate-mkdir-blocked.sh
    points: 1
  - name: tmp-write-denied
    description: scout runs under the AppArmor profile k8s-deny-tmp-write in enforce mode, and writing a file under /tmp fails with Permission denied
    type: file
    source: vm/validate-tmp-write-denied.sh
    points: 1
