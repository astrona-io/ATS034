apiVersion: v1
kind: Pod
metadata:
  name: scout
  namespace: starfleet-034-010-02-03
  labels:
    app: scout
spec:
  containers:
  - name: scout
    image: docker.io/library/busybox:1.37.0
    command: ["sleep", "infinity"]
    securityContext:
      seccompProfile:
        type: Localhost
        localhostProfile: profiles/block-mkdir.json
      appArmorProfile:
        type: Localhost
        localhostProfile: k8s-deny-tmp-write
