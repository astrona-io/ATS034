apiVersion: astrona.io/v1
metadata:
  name: ats-034-lab-010-03-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/busybox:1.37.0
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: compliant-enforced
    description: bridge-034-010-03-01 enforces Restricted at v1.35, so a Pod without security settings is rejected, and the bridge Deployment stays Ready
    type: file
    source: validation/validate-compliant-enforced.sh
    points: 1
  - name: noncompliant-warned
    description: starfleet-034-010-03-01 and outpost-034-010-03-01 still admit a Pod without security settings but return a restricted:v1.35 warning
    type: file
    source: validation/validate-noncompliant-warned.sh
    points: 1
