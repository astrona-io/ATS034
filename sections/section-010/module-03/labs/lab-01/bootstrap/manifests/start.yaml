apiVersion: v1
kind: Namespace
metadata:
  name: bridge-034-010-03-01
---
apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-034-010-03-01
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost-034-010-03-01
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bridge
  namespace: bridge-034-010-03-01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bridge
  template:
    metadata:
      labels:
        app: bridge
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: bridge
        image: docker.io/library/busybox:1.37.0
        command: ["sleep", "infinity"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle
  namespace: starfleet-034-010-03-01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle
  template:
    metadata:
      labels:
        app: shuttle
    spec:
      containers:
      - name: shuttle
        image: docker.io/library/busybox:1.37.0
        command: ["sleep", "infinity"]
---
apiVersion: v1
kind: Pod
metadata:
  name: drifter
  namespace: outpost-034-010-03-01
  labels:
    app: drifter
spec:
  containers:
  - name: drifter
    image: docker.io/library/busybox:1.37.0
    command: ["sleep", "infinity"]
