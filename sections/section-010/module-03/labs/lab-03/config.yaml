apiVersion: astrona.io/v1
metadata:
  name: ats-034-lab-010-03-03
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/busybox:1.37.0
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: agent-admitted
    description: node-agents-034-010-03-03 enforces Privileged and warns and audits Baseline at v1.35, and log-agent runs and reads /var/log from the node
    type: file
    source: validation/validate-agent-admitted.sh
    points: 1
  - name: labels-protected
    description: The deployer ServiceAccount can no longer update or patch namespaces, but still manages Deployments in starfleet-034-010-03-03
    type: file
    source: validation/validate-labels-protected.sh
    points: 1
