apiVersion: astrona.io/v1
metadata:
  name: ats-034-lab-010-03-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
# The lab edits the kube-apiserver static pod manifest, so it runs in its own VM.
runtime:
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 25
    display: false
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: vm/install.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: vm/verify-start.sh
  - name: reference-result
    type: file
    source: vm/apply-solution.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: vm/wait-solved.sh
validation:
  scripts:
  - name: default-baseline
    description: Without namespace labels, starfleet-034-010-03-02 rejects a privileged Pod with baseline:v1.35 and warns on restricted:v1.35
    type: file
    source: vm/validate-default-baseline.sh
    points: 1
  - name: namespace-exempt
    description: node-agents-034-010-03-02 is exempt, so a privileged Pod is admitted there without a Pod Security warning
    type: file
    source: vm/validate-namespace-exempt.sh
    points: 1
