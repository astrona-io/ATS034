version: 1
approval: Maintainer requested CKA and CKS playgrounds and graded labs on 2026-10-13,
  superseding the earlier reading-only scope.
course:
  id: ATS034
  certification:
    name: Certified Kubernetes Security Specialist
    code: CKS
    provider: CNCF / Linux Foundation
    domain: Minimize Microservice Vulnerabilities
    weight: 20
    competencies:
    - Use appropriate pod security standards
    - Manage Kubernetes secrets
    - Understand and implement isolation techniques (multi-tenancy, sandboxed containers,
      etc.)
    - Implement Pod-to-Pod encryption (Cilium, Istio)
defaults:
  playground: true
  module_lab: false
  capstone: false
  section_quiz: false
  final_quiz: true
assessment_format: YAML question banks v1, registered in assessments/index.yaml
sections:
- id: section-010
  title: Use appropriate pod security standards
  curriculum_item: Use appropriate pod security standards
  capstone: false
  section_quiz: false
  modules:
  - id: module-01
    title: Pod Security Profiles
    objectives:
    - Compare Privileged, Baseline and Restricted profiles.
    - Explain the purpose and limits of security-context fields.
    - Relate image users and writable paths to profile compatibility.
    - Distinguish compliant configuration from complete application security.
    outline:
    - The Three Pod Security Standards
    - Security Context Fields
    - Pod Security Admission Modes
    - Admission For Workloads And Troubleshooting
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-010/module-01/course-01-the-three-pod-security-standards.md
      adapted_from: null
    - reading: sections/section-010/module-01/course-02-security-context-fields.md
      adapted_from: null
    - reading: sections/section-010/module-01/course-03-pod-security-admission-modes.md
      adapted_from: null
    - reading: sections/section-010/module-01/course-04-admission-for-workloads-and-troubleshooting.md
      adapted_from: null
    labs:
    - id: lab-01
      path: sections/section-010/module-01/labs/lab-01
      after_reading: sections/section-010/module-01/course-03-pod-security-admission-modes.md
      objective: Admit a compliant Pod and reject a privileged Pod through the API
        server.
      status: draft
      runtime_verification: pending
- id: section-020
  title: Manage Kubernetes secrets
  curriculum_item: Manage Kubernetes secrets
  capstone: false
  section_quiz: false
  modules:
  - id: module-01
    title: Secret Delivery And Credential Lifecycle
    objectives:
    - Explain why Secret encoding is not encryption.
    - Compare environment and mounted-file update behavior.
    - Identify authorization and diagnostic exposure risks.
    - Describe rotation that updates consumers and revokes old authority.
    outline:
    - What A Secret Is And Who Can Read It
    - Delivering Secrets To Pods
    - Rotating A Secret
    - Encryption At Rest
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-020/module-01/course-01-what-a-secret-is-and-who-can-read-it.md
      adapted_from: null
    - reading: sections/section-020/module-01/course-02-delivering-secrets-to-pods.md
      adapted_from: null
    - reading: sections/section-020/module-01/course-03-rotating-a-secret.md
      adapted_from: null
    - reading: sections/section-020/module-01/course-04-encryption-at-rest.md
      adapted_from: null
    labs:
    - id: lab-01
      path: sections/section-020/module-01/labs/lab-01
      after_reading: sections/section-020/module-01/course-03-rotating-a-secret.md
      objective: Replace a disposable credential and verify both delivery paths use
        the new value.
      status: draft
      runtime_verification: pending
- id: section-030
  title: Understand and implement isolation techniques (multi-tenancy, sandboxed containers,
    etc.)
  curriculum_item: Understand and implement isolation techniques (multi-tenancy, sandboxed
    containers, etc.)
  capstone: false
  section_quiz: false
  modules:
  - id: module-01
    title: Choosing Isolation For Untrusted Tenants
    objectives:
    - Distinguish namespaced API separation from kernel isolation.
    - Compare shared-kernel, sandboxed-runtime and dedicated-node boundaries.
    - Explain RuntimeClass prerequisites and scheduling effects.
    - Evaluate residual credentials, network and resource risks.
    outline:
    - Namespaces And RBAC As A Tenant Boundary
    - Resource Isolation With ResourceQuota And LimitRange
    - Network Isolation And Token Minimization
    - Sandboxed Containers With RuntimeClass
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-030/module-01/course-01-namespaces-and-rbac-as-a-tenant-boundary.md
      adapted_from: null
    - reading: sections/section-030/module-01/course-02-resource-isolation-with-resourcequota-and-limitrange.md
      adapted_from: null
    - reading: sections/section-030/module-01/course-03-network-isolation-and-token-minimization.md
      adapted_from: null
    - reading: sections/section-030/module-01/course-04-sandboxed-containers-with-runtimeclass.md
      adapted_from: null
    labs:
    - id: lab-01
      path: sections/section-030/module-01/labs/lab-01
      after_reading: sections/section-030/module-01/course-03-network-isolation-and-token-minimization.md
      objective: Combine admission, a resource budget, token minimization and network
        isolation for one tenant.
      status: draft
      runtime_verification: pending
- id: section-040
  title: Implement Pod-to-Pod encryption (Cilium, Istio)
  curriculum_item: Implement Pod-to-Pod encryption (Cilium, Istio)
  capstone: false
  section_quiz: false
  modules:
  - id: module-01
    title: Service Mesh Identity And Policy
    objectives:
    - Distinguish encrypted transport, peer authentication and authorization.
    - Explain where mesh components implement communication policy.
    - Relate certificate rotation and hop boundaries to trust.
    - Identify residual application and retry requirements.
    outline:
    - Pod Traffic And Encryption Options
    - Istio Mutual TLS With PeerAuthentication
    - Authorizing Workloads With AuthorizationPolicy
    - Cilium Transparent Encryption
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-040/module-01/course-01-pod-traffic-and-encryption-options.md
      adapted_from: null
    - reading: sections/section-040/module-01/course-02-istio-mutual-tls-with-peerauthentication.md
      adapted_from: null
    - reading: sections/section-040/module-01/course-03-authorizing-workloads-with-authorizationpolicy.md
      adapted_from: null
    - reading: sections/section-040/module-01/course-04-cilium-transparent-encryption.md
      adapted_from: null
    labs:
    - id: lab-01
      path: sections/section-040/module-01/labs/lab-01
      after_reading: sections/section-040/module-01/course-02-istio-mutual-tls-with-peerauthentication.md
      objective: Require mesh-authenticated traffic while keeping the injected client
        able to reach the application.
      status: draft
